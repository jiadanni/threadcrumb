# ThreadCrumb Configuration Example
# Copy this file to ~/.threadcrumb/config.yaml and customize

slack:
  # Slack OAuth access token (populated after running 'threadcrumb auth')
  access_token: null

  # Slack workspace ID
  workspace_id: null

  # Specific channels to process (empty = all channels)
  channels: []

  # Channels to exclude from processing
  exclude_channels: []

  # Delay between API requests (seconds)
  rate_limit_delay: 1.0

  # Maximum retries for failed requests
  max_retries: 3

  # Enable message caching
  cache_enabled: true

  # Cache directory path
  cache_dir: .threadcrumb/cache

ai:
  # AI provider (currently only 'bedrock' supported)
  provider: bedrock

  # AWS Bedrock model name
  # Options:
  # - anthropic.claude-3-sonnet-20240229-v1:0 (balanced)
  # - anthropic.claude-3-haiku-20240307-v1:0 (fast & cheap)
  # - anthropic.claude-3-opus-20240229-v1:0 (most powerful)
  model_name: anthropic.claude-3-sonnet-20240229-v1:0

  # AWS region
  region: us-east-1

  # Maximum tokens in AI response
  max_tokens: 4096

  # Sampling temperature (0.0-1.0)
  temperature: 0.7

  # Enable fallback to basic processing if AI fails
  fallback_enabled: true

  # AWS profile name (optional)
  aws_profile: null

processing:
  # Reconstruct conversation threads
  thread_reconstruction: true

  # Include file attachments in processing
  include_attachments: true

  # Minimum message length to include
  min_message_length: 10

  # Maximum thread depth to process
  max_thread_depth: 50

  # Enable content categorization
  categorization_enabled: true

  # Enable topic extraction
  topic_extraction_enabled: true

  # Enable summary generation
  summary_enabled: true

  # Enable Q&A pair generation
  qa_generation_enabled: true

  # Enable sentiment analysis
  sentiment_analysis: false

  # Enable importance scoring
  importance_scoring: true

output:
  # Output format: markdown, html, json, xml
  format: markdown

  # Output directory
  output_dir: output

  # Create index page
  create_index: true

  # Add cross-links between related pages
  interlink_pages: true

  # Include search functionality (HTML only)
  include_search: true

  # Include table of contents
  include_toc: true

  # Date format string
  date_format: '%Y-%m-%d %H:%M:%S'

confluence:
  # Confluence base URL
  # Cloud: https://yourcompany.atlassian.net
  # Server: http://confluence.company.com:8090
  base_url: null

  # Confluence username
  # Cloud: your.email@company.com
  # Server: your-username
  username: null

  # API token
  # Cloud: Generate at https://id.atlassian.com/manage-profile/security/api-tokens
  # Server: Your Confluence password
  api_token: null

  # Space key where wiki will be created
  space_key: null

  # Use Confluence Cloud API (true) or Server/Data Center API (false)
  use_cloud: true

  # Root page title for your wiki
  root_page_title: "Slack Wiki"

  # Optional: Parent page ID to nest wiki under existing page
  # Find in page URL: /wiki/spaces/SPACE/pages/123456/Page+Title
  parent_page_id: null

  # Page organization structure
  # Options: flat, hierarchical, by-category
  structure: flat

  # Add labels to pages for better organization
  add_labels: true

  # Dry run mode (preview without creating pages)
  dry_run: false
