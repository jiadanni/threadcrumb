[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slackcrumb"
version = "0.1.0"
description = "Playwright-based Slack history exporter for users without API access"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "playwright>=1.40.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
slackcrumb = "slackcrumb.cli:cli"

[tool.setuptools.packages.find]
include = ["slackcrumb*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
