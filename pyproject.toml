[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threadcrumb"
version = "0.1.0"
description = "AI-powered Slack workspace analyzer and wiki generator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ThreadCrumb Team"}
]
keywords = ["slack", "wiki", "ai", "documentation", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.1.0",
    "slack-sdk>=3.23.0",
    "boto3>=1.28.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "markdown>=3.4.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]
search = [
    "whoosh>=2.7.4",
]
ai-openai = [
    "openai>=1.0.0",
]
ai-anthropic = [
    "anthropic>=0.18.0",
]
interactive = [
    "rich>=13.0.0",
]
security = [
    "cryptography>=41.0.0",
]
all = [
    "whoosh>=2.7.4",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
threadcrumb = "threadcrumb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["threadcrumb*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
